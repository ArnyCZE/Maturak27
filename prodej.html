<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prodej vstupenek – Maturák 2027</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e6b84f; --gold-mid: #f4cf63; --gold-hi: #fff1b8; --butter: #fdf08a;
    --text: #f6efd9; --muted: #a69a7c; --line: rgba(232,190,90,.25); --bad: #ff6b6b; --ok: #7be38f;
    --metal: linear-gradient(180deg, #fff6c8 0%, #f7d56a 30%, #d79b23 55%, #fbe38a 72%, #b07a17 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Montserrat", sans-serif; background: #000; color: var(--text);
    min-height: 100vh; padding: 1.2rem; line-height: 1.5;
    background: radial-gradient(ellipse at top, rgba(230,184,79,.12), transparent 60%), #000;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    font-family: "Archivo Black", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 1.6rem; margin: .4rem 0 1.2rem;
    background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card { border: 1px solid var(--line); border-radius: 20px; padding: 1.3rem; background: #0b0905; margin-bottom: 1rem; }
  label { display: block; font-weight: 800; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: .9rem 0 .35rem; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; font: inherit; font-size: 1.05rem; color: var(--text);
    background: #000; border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem;
  }
  select { appearance: none; }
  .row { display: flex; gap: .6rem; }
  .row > * { flex: 1; }
  .btn {
    display: block; width: 100%; margin-top: 1.1rem; cursor: pointer;
    font: inherit; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem;
    border: 0; border-radius: 999px; padding: 1rem; color: #1a1406; background: var(--butter);
  }
  .btn.secondary { background: transparent; color: var(--gold); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: .8rem; font-size: .9rem; min-height: 1.3em; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .hint { color: var(--muted); font-size: .82rem; margin-top: .5rem; }
  .qr { background: #fff; border-radius: 16px; padding: 12px; width: 260px; max-width: 100%; margin: 0 auto; }
  .qr svg { display: block; width: 100%; height: auto; }
  .pay { text-align: center; }
  .amount { font-family: "Archivo Black", sans-serif; font-size: 2.2rem; margin-top: .8rem;
    background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .details { color: var(--muted); font-size: .9rem; }
  .details b { color: var(--text); }
  .timer { font-family: "Archivo Black", sans-serif; font-size: 1.6rem; margin: .8rem 0 .2rem; color: var(--gold-mid); }
  .timer.low { color: var(--bad); }
  .state { display: inline-block; margin-top: .6rem; padding: .35rem .9rem; border-radius: 999px; font-weight: 800; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); }
  .state.ok { color: var(--ok); border-color: var(--ok); }
  .settings-link { display: block; text-align: center; margin-top: 1.4rem; color: var(--muted); font-size: .8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Prodej vstupenek</h1>

  <!-- nastavení: adresa skriptu a PIN se uloží jen v tomhle telefonu -->
  <div class="card" id="setup" hidden>
    <label for="cfg-url">Adresa skriptu z tabulky</label>
    <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label for="cfg-pin">PIN</label>
    <input id="cfg-pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn" id="cfg-save">Uložit</button>
    <p class="hint">Údaje se uloží jen v tomhle prohlížeči. Bez PINu nikdo jiný místa rezervovat nemůže.</p>
    <p class="msg" id="cfg-msg"></p>
  </div>

  <!-- nová objednávka -->
  <div class="card" id="order" hidden>
    <label for="table">Stůl</label>
    <select id="table"></select>
    <div class="row">
      <div>
        <label for="count">Počet míst</label>
        <select id="count"></select>
      </div>
      <div>
        <label>Cena</label>
        <input id="price" readonly value="–">
      </div>
    </div>
    <label for="name">Jméno kupujícího</label>
    <input id="name" autocomplete="off">
    <label for="contact">Kontakt (nepovinné)</label>
    <input id="contact" autocomplete="off" placeholder="telefon nebo e-mail">
    <button class="btn" id="hold">Vytvořit QR a podržet místa</button>
    <p class="msg" id="order-msg"></p>
  </div>

  <!-- QR platba -->
  <div class="card pay" id="payment" hidden>
    <div class="qr" id="qr"></div>
    <div class="amount" id="pay-amount"></div>
    <p class="details">
      Stůl <b id="pay-table"></b> · <b id="pay-count"></b> míst<br>
      VS <b id="pay-vs"></b> · účet <b id="pay-account"></b>
    </p>
    <div class="timer" id="timer"></div>
    <p class="hint" id="timer-hint">Místa jsou podržená. Po zaplacení potvrď rezervaci.</p>
    <span class="state" id="pay-state" hidden></span>
    <button class="btn" id="confirm">✓ Kupující zaplatil – potvrdit</button>
    <button class="btn secondary" id="cancel">Zrušit</button>
    <button class="btn secondary" id="next" hidden>Nový prodej</button>
    <p class="msg" id="pay-msg"></p>
  </div>

  <a href="#" class="settings-link" id="open-settings">Nastavení</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="prodej.js"></script>
</body>
</html>
